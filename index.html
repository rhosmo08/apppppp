<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEPESTCON CO — Job Reports</title>
<style>
/* ============================================================
   GEPESTCON CO — DESIGN TOKENS
   Ported unchanged from the original app. Do not rename or remove
   any of these — new screens and Phase 2's dark tokens both build
   on top of them. The app is intentionally light-only for now
   (dark mode is Phase 2, not this pass).
   ============================================================ */
:root{
  --paper: #FFFFFF;
  --paper-alt: #F7F7F8;
  --surface: #FFFFFF;
  --ink: #14161A;
  --ink-soft: #5A5A60;
  --ink-faint: #94949A;
  --line: #E7E7EA;
  --line-strong: #D3D3D8;

  --forest: #1F5C46;
  --forest-dark: #123A2C;
  --forest-pale: #DCEAE2;
  --forest-pale2: #CFE3D8;

  --rust: #AE402C;
  --rust-dark: #832C1D;
  --rust-pale: #F5DEDA;

  --amber: #BD7C1F;
  --amber-pale: #F5E7CC;

  /* Brand accent (Section 4): the red/rust family is the UI's primary
     interactive color everywhere but the severity gauge — buttons,
     links, active states, focus rings, selected chips. --forest/
     --amber/--rust keep their exact existing meaning as the severity
     scale; they are not being repainted. */
  --brand: #E4141A;
  --brand-dark: #AD1017;
  --brand-pale: #FCE6E4;
  --icon-neutral: #33393D;    /* charcoal — Dashboard type-card glyphs only, per reference images */
  --nav-active-pale: #FEEFEE; /* sidebar/tab active-item pill background */

  --white: #ffffff;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  --shadow-sm: 0 1px 2px rgba(20,22,26,.06), 0 1px 1px rgba(20,22,26,.08);
  --shadow-md: 0 6px 20px rgba(20,22,26,.14);
  --scrim-chrome: rgba(255,255,255,.85);
  --scrim-modal: rgba(10,10,10,.55);

  --header-h: 60px;
  --footer-h: 78px;
}

/* ============================================================
   DARK TOKENS (Phase 2)
   Starting point per Section 7's table, not a final answer — these
   haven't been eyeballed against a live render yet (I don't have a
   browser here), so treat exact hues as provisional until checked
   against the actual dark screenshots on a real screen.
   Forest/amber/rust keep their meaning, lightened only enough to
   stay legible on near-black; brand becomes a more saturated red to
   read as "glowing," matching the reference dark screenshots.
   ============================================================ */
:root[data-theme="dark"]{
  --paper: #000000;
  --paper-alt: #0A0A0A;
  --surface: #0A0A0A;
  --ink: #F5F5F5;
  --ink-soft: #ABABB0;
  --ink-faint: #6E6E72;
  --line: #2A1414;
  --line-strong: rgba(255,49,49,.45);

  --forest: #2E8562;
  --forest-dark: #6FD4AC;
  --forest-pale: #163229;
  --forest-pale2: #1B3D31;

  --rust: #E8543F;
  --rust-dark: #F29184;
  --rust-pale: #3A1B17;

  --amber: #E0A54A;
  --amber-pale: #3A2E17;

  --brand: #FF3131;
  --brand-dark: #FF6B5B;
  --brand-pale: #2A1010;
  --icon-neutral: var(--brand-dark); /* dark-mode type-card glyphs are bright red, not gray, per the screenshots */
  --nav-active-pale: #450A0C;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  --shadow-md: 0 8px 28px rgba(255,49,49,.15), 0 8px 24px rgba(0,0,0,.6);
  --scrim-chrome: rgba(0,0,0,.85);
  --scrim-modal: rgba(0,0,0,.7);
}
:root[data-theme="dark"] .card,
:root[data-theme="dark"] .type-card,
:root[data-theme="dark"] .sig-wrap,
:root[data-theme="dark"] .photo-tile,
:root[data-theme="dark"] .hist-item{
  border-color: var(--line-strong);
  box-shadow: none; /* Section 7: "a subtle border rather than a shadow" on dark surfaces */
}

:focus-visible{
  outline: 2.5px solid var(--brand);
  outline-offset: 2px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background: var(--paper); color: var(--ink);
  font-family: var(--font-sans); -webkit-font-smoothing:antialiased;
  line-height:1.4;
}
h1,h2,h3{ margin:0; font-weight:800; letter-spacing:-.01em; }
p{ margin:0; }
button{ font:inherit; cursor:pointer; color:inherit; }
a{ color:inherit; }
.stack-14 > * + *{ margin-top:14px; }
.small-muted{ font-size:12.5px; color: var(--ink-soft); }
.center{ text-align:center; }
.eyebrow{
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing:.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 600;
}

/* ---------- App shell ----------
   Layout (mobile-block / desktop-flex-row) is fully defined on
   .shell-frame in the responsive shell section below — this element
   only needed its ID for JS hooks, not its own layout rule. */

.app-header{
  position: sticky; top:0; z-index: 40;
  height: var(--header-h);
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 16px;
  background: var(--scrim-chrome);
  backdrop-filter: blur(10px) saturate(1.1);
  border-bottom: 1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:10px; background:none; border:none; padding:0; }
.brand-mark{ width:34px; height:34px; flex:0 0 auto; }
.brand-word{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.05; }
.brand-word b{ font-size:15px; letter-spacing:.02em; font-weight:800; color: var(--ink); }
.brand-co{ color: var(--brand); } /* defect #3, fixed: was pointed at --rust (severity token), which drifts away from the new vivid brand red since --rust's value is intentionally untouched */
.brand-word span{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color: var(--ink-faint); }
.header-actions{ display:flex; align-items:center; gap:6px; }
.icon-btn{
  width:38px; height:38px; border-radius: var(--radius-pill);
  display:flex; align-items:center; justify-content:center;
  background: transparent; border: 1px solid transparent; color: var(--ink-soft);
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.icon-btn:hover{ background: var(--brand-pale); color: var(--brand-dark); }
.icon-btn.is-active{ background: var(--brand); color: var(--white); }
.icon-btn svg{ width:19px; height:19px; }

/* Minimal "who's logged in" chip — full profile chip / dropdown is Phase 2/3's
   header redesign; this pass just needs auth to be visibly real. */
.header-user{ display:flex; align-items:center; gap:8px; }
.header-user .hu-name{ font-size:12.5px; font-weight:700; line-height:1.15; text-align:right; }
.header-user .hu-role{ display:block; font-size:10.5px; font-weight:600; color: var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }

.app-main{ flex:1; width:100%; max-width: 760px; margin: 0 auto; padding: 20px 16px calc(var(--footer-h) + 28px); position:relative; }
.app-main.no-footer-pad{ padding-bottom: 40px; }

/* ---------- Buttons ---------- */
.btn{
  appearance:none; border:none; border-radius: var(--radius-md);
  padding: 12px 18px; font-size: 14.5px; font-weight: 700; letter-spacing:.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition: transform .12s ease, box-shadow .12s ease, background .15s ease, opacity .15s ease;
  white-space: nowrap;
}
.btn svg{ width:17px; height:17px; flex:0 0 auto; }
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--brand); color: var(--white); box-shadow: var(--shadow-sm); }
.btn-primary:hover{ background: var(--brand-dark); }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.btn-secondary{ background: var(--surface); color: var(--ink); border:1.5px solid var(--line-strong); }
.btn-secondary:hover{ border-color: var(--brand); color: var(--brand-dark); }
.btn-ghost{ background: transparent; color: var(--ink-soft); padding: 10px 12px; }
.btn-ghost:hover{ color: var(--brand-dark); }
.btn-danger{ background: var(--rust-pale); color: var(--rust-dark); }
.btn-danger:hover{ background: #f0cac3; }
.btn-block{ width:100%; }
.btn-lg{ padding: 15px 22px; font-size: 15.5px; border-radius: var(--radius-md); }
.btn-sm{ padding: 8px 12px; font-size: 13px; border-radius: var(--radius-sm); }

/* ---------- Cards / sections ---------- */
.card{
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
  padding: 20px;
}
.section-title{ font-size: 17px; font-weight: 800; letter-spacing:-.01em; margin-bottom:2px; }
.section-hint{ color: var(--ink-soft); font-size: 13.5px; margin-bottom: 16px; }
.hairline{ height:1px; background: var(--line); border:none; margin: 18px 0; }

/* ---------- Type-select cards (home) ---------- */
/* defect #4 fix: the reference mobile screenshots show 3 columns already at
   phone width, not just from 600px up. Always 3 columns; padding/type tighten
   further down so the copy still fits without overflowing at ~360-390px. */
.type-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
.type-card{
  text-align:left; background: var(--surface); border:1.5px solid var(--line);
  border-radius: var(--radius-lg); padding:18px; display:flex; flex-direction:column; gap:10px;
  transition: border-color .15s ease, transform .12s ease, box-shadow .15s ease;
  position:relative; overflow:hidden;
}
.type-card:hover{ border-color: var(--brand); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.type-card:active{ transform: translateY(0) scale(.99); }
.type-card .type-icon{
  width:44px; height:44px; position:relative;
  background: var(--brand-pale); color: var(--icon-neutral);
  display:flex; align-items:center; justify-content:center;
  clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);
}
/* clip-path shapes can't take a normal border, so the dark-mode hex outline
   is a second, slightly larger hexagon peeking out from behind. */
:root[data-theme="dark"] .type-card .type-icon::before{
  content:''; position:absolute; inset:-1.5px; z-index:-1;
  background: var(--brand); opacity:.55;
  clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
}
.type-card .type-icon svg{ width:23px; height:23px; }
.type-card h3{ font-size:15.5px; }
.type-card p{ color: var(--ink-soft); font-size:13px; line-height:1.45; }
.type-card .type-go{ margin-top:auto; display:flex; align-items:center; gap:5px; color: var(--brand); font-weight:700; font-size:13px; }
.type-card .type-go svg{ width:15px; height:15px; transition: transform .15s ease; }
.type-card:hover .type-go svg{ transform: translateX(3px); }
@media(max-width:420px){
  .type-grid{ gap:7px; }
  .type-card{ padding:11px 9px; gap:7px; }
  .type-card .type-icon{ width:34px; height:34px; }
  .type-card .type-icon svg{ width:18px; height:18px; }
  .type-card h3{ font-size:12.5px; line-height:1.25; }
  .type-card p{ font-size:10.5px; line-height:1.35; }
  .type-card .type-go{ font-size:11px; }
}

/* ---------- Stepper / progress rail ---------- */
.wizard-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.back-link{ display:flex; align-items:center; gap:5px; color: var(--ink-soft); font-size:13.5px; font-weight:600; background:none; border:none; padding:6px 2px; }
.back-link:hover{ color: var(--brand-dark); }
.back-link svg{ width:16px; height:16px; }
.step-tag{ font-family: var(--font-mono); font-size:12px; color: var(--ink-faint); letter-spacing:.04em; }
.step-rail{ display:flex; gap:5px; margin-bottom:22px; }
.step-rail i{ flex:1; height:5px; border-radius: var(--radius-pill); background: var(--line); overflow:hidden; position:relative; }
.step-rail i.is-done{ background: var(--brand); }
.step-rail i.is-current{ background: var(--line); }
.step-rail i.is-current::after{ content:''; position:absolute; inset:0; width:45%; background: var(--brand); border-radius: var(--radius-pill); }

/* ---------- Form primitives ---------- */
.field{ margin-bottom: 16px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color: var(--ink-soft); margin-bottom:6px; letter-spacing:.01em; }
.field label .req{ color: var(--rust); margin-left:2px; }
.field .hint{ font-size:12px; color: var(--ink-faint); margin-top:5px; }
.field .err{ font-size:12.5px; color: var(--rust-dark); margin-top:5px; font-weight:600; display:none; }
.field.has-error .err{ display:block; }
.field.has-error input, .field.has-error select, .field.has-error textarea{ border-color: var(--rust); background: var(--rust-pale); }

.input, select.input, textarea.input{
  width:100%; background: var(--paper); border:1.5px solid var(--line);
  border-radius: var(--radius-sm); padding: 11px 13px; color: var(--ink);
  transition: border-color .15s ease, background .15s ease;
  font-family: inherit; font-size: 14px;
}
.input::placeholder{ color: var(--ink-faint); }
.input:focus{ border-color: var(--brand); background: var(--surface); outline:none; }
textarea.input{ resize: vertical; min-height: 84px; line-height:1.5; }
select.input{ appearance:none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2355645B" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>'); background-repeat:no-repeat; background-position: right 12px center; padding-right:34px; }
select.input.has-value{ border-color: var(--brand); background-color: var(--brand-pale); color: var(--brand-dark); font-weight:700; }

.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
@media(max-width:520px){ .row-3{ grid-template-columns:1fr 1fr; } }

.chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  border:1.5px solid var(--line); background: var(--surface); color: var(--ink-soft);
  padding: 9px 14px; border-radius: var(--radius-pill); font-size:13.5px; font-weight:600;
  display:flex; align-items:center; gap:7px; transition: all .12s ease;
}
.chip svg{ width:15px; height:15px; opacity:0; transition: opacity .12s ease; margin-left:-3px; width:0; }
.chip.is-on{ background: var(--brand-pale); border-color: var(--brand); color: var(--brand-dark); }
.chip.is-on svg{ opacity:1; width:15px; }
.chip:hover{ border-color: var(--brand); }

.check-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
@media(max-width:480px){ .check-grid{ grid-template-columns:1fr; } }
.check-row{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border:1.5px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
  transition: border-color .12s ease, background .12s ease;
}
.check-row.is-on{ border-color: var(--brand); background: var(--brand-pale); }
.check-row input[type=checkbox]{ width:17px; height:17px; accent-color: var(--brand); flex:0 0 auto; }
.check-row span{ font-size:13.5px; font-weight:600; }

fieldset{ border:none; padding:0; margin:0; }
legend{ padding:0; font-size:12.5px; font-weight:700; color: var(--ink-soft); margin-bottom:8px; }

.group-block{ border:1.5px solid var(--line); border-radius: var(--radius-md); padding:14px 14px 6px; margin-bottom:14px; background: var(--paper); }
.group-block > .group-title{ font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color: var(--brand-dark); margin-bottom:10px; }

/* ---------- Severity gauge (signature element) ---------- */
.gauge{ display:flex; align-items:center; gap:14px; }
.gauge-track{ flex:1; display:flex; gap:4px; height:14px; }
.gauge-seg{ flex:1; border-radius:4px; background: var(--line); position:relative; transition: background .18s ease; }
.gauge-seg[data-level="1"].is-active{ background: var(--forest); }
.gauge-seg[data-level="2"].is-active{ background: var(--amber); }
.gauge-seg[data-level="3"].is-active{ background: var(--rust); }
.gauge-label{ font-family: var(--font-mono); font-size:12px; font-weight:700; letter-spacing:.03em; min-width:74px; text-align:right; }
.gauge-label[data-level="0"]{ color: var(--ink-faint); }
.gauge-label[data-level="1"]{ color: var(--forest-dark); }
.gauge-label[data-level="2"]{ color: var(--amber); }
.gauge-label[data-level="3"]{ color: var(--rust); }
.gauge-picker{ display:flex; gap:6px; margin-top:8px; }
.gauge-btn{ flex:1; border:1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding:8px 4px; font-size:12px; font-weight:700; color: var(--ink-soft); text-align:center; }
.gauge-btn[data-lv="1"].is-picked{ background: var(--forest-pale); border-color: var(--forest); color: var(--forest-dark); }
.gauge-btn[data-lv="2"].is-picked{ background: var(--amber-pale); border-color: var(--amber); color: var(--amber); }
.gauge-btn[data-lv="3"].is-picked{ background: var(--rust-pale); border-color: var(--rust); color: var(--rust-dark); }

.pest-severity-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
.pest-severity-row:last-child{ border-bottom:none; }
.pest-severity-row .pest-name{ font-weight:700; font-size:13.5px; min-width:92px; }

/* ---------- Photo grid ---------- */
.photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.photo-tile{ position:relative; aspect-ratio:1; border-radius: var(--radius-sm); overflow:hidden; background: var(--paper-alt); border:1px solid var(--line); }
.photo-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-remove{
  position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%;
  background: rgba(20,28,22,.72); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
}
.photo-remove svg{ width:13px; height:13px; }
.photo-add{
  aspect-ratio:1; border-radius: var(--radius-sm); border:1.5px dashed var(--line-strong);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  color: var(--ink-soft); font-size:11px; font-weight:700; cursor:pointer; background: var(--paper);
}
.photo-add svg{ width:20px; height:20px; }
.photo-add:hover{ border-color: var(--brand); color: var(--brand-dark); }

/* ---------- Signature pad ---------- */
.sig-wrap{ border:1.5px solid var(--line); border-radius: var(--radius-md); overflow:hidden; background: var(--surface); }
.sig-wrap canvas{
  width:100%; height:150px; display:block; touch-action:none;
  background: repeating-linear-gradient(var(--surface) 0 27px, var(--line) 27px 28px);
}
.sig-toolbar{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-top:1px solid var(--line); font-size:12px; color: var(--ink-faint); }

/* ---------- Helper banners ---------- */
.helper-banner{ display:flex; gap:10px; align-items:flex-start; background: var(--forest-pale); border-radius: var(--radius-md); padding:12px 14px; font-size:12.5px; color: var(--forest-dark); margin-bottom:16px; }
.helper-banner svg{ width:17px; height:17px; flex:0 0 auto; margin-top:1px; }
.helper-banner.amber{ background: var(--amber-pale); border-color:#e8cf9c; color:#7a521a; }

/* ---------- Ticket (control number stub) ---------- */
.ticket{ background: var(--ink); border-radius: var(--radius-md); padding:9px 14px; display:flex; flex-direction:column; align-items:flex-end; }
.ticket .t-label{ font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#9CB0A4; }
.ticket .t-num{ font-family: var(--font-mono); font-size:15px; font-weight:700; color:#F0B79E; }

/* ---------- Review screen ---------- */
.review-block{ margin-bottom:20px; }
.review-block:last-child{ margin-bottom:0; }
.rb-title{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-faint); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.rb-edit{ display:flex; align-items:center; gap:4px; background:none; border:none; color: var(--brand-dark); font-size:11.5px; font-weight:700; text-transform:none; letter-spacing:0; }
.rb-edit svg{ width:13px; height:13px; }
.kv{ display:grid; grid-template-columns: 130px 1fr; gap:8px 12px; margin:0; }
.kv dt{ font-size:12.5px; color: var(--ink-soft); font-weight:600; }
.kv dd{ margin:0; font-size:13.5px; }
.kv dd.empty{ color: var(--ink-faint); font-style:italic; }
@media(max-width:480px){ .kv{ grid-template-columns:1fr; } .kv dt{ margin-top:6px; } }

/* ---------- Divider label (Recent reports, Quick access, etc.) ---------- */
.divider-label{
  display:flex; align-items:center; gap:10px; margin: 26px 0 14px;
  font-family: var(--font-mono); font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--brand);
}
.divider-label::before, .divider-label::after{ content:''; flex:1; height:1px; background: var(--brand-pale); }
.divider-label::before{ margin-right:2px; }
.divider-label::after{ margin-left:2px; }

/* ---------- Footer bar (contextual — wizard/review only) ---------- */
.footer-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:35;
  background: var(--scrim-chrome); backdrop-filter: blur(10px) saturate(1.1);
  border-top:1px solid var(--line);
}
.footer-bar-inner{ max-width:760px; margin:0 auto; padding:14px 16px; display:flex; gap:10px; }
.footer-bar-inner .btn{ flex:1; }

/* ---------- Toasts ---------- */
.toast-root{ position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 16px; pointer-events:none; }
.toast{
  pointer-events:auto; max-width:420px; display:flex; align-items:center; gap:9px;
  background: var(--ink); color:#fff; padding:11px 16px; border-radius: var(--radius-md); font-size:13.5px; font-weight:600;
  box-shadow: var(--shadow-md);
}
.toast svg{ width:16px; height:16px; flex:0 0 auto; }
.toast.is-error{ background: var(--rust-dark); }
.toast.is-success{ background: var(--forest-dark); }

/* ---------- Modal ---------- */
.modal-overlay{ position:fixed; inset:0; z-index:70; background: var(--scrim-modal); display:flex; align-items:flex-end; justify-content:center; padding:0; }

.modal-sheet{ background: var(--surface); width:100%; max-width:480px; border-radius: 20px 20px 0 0; padding:22px; max-height:88vh; overflow-y:auto; animation: sheetUp .22s cubic-bezier(.2,.8,.3,1); }
@media(min-width:640px){ .modal-sheet{ border-radius: var(--radius-lg); } }
@keyframes sheetUp{ from{ transform: translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.modal-head h3{ font-size:16.5px; }
.modal-close{ width:30px; height:30px; border-radius:50%; background: var(--paper); border:none; display:flex; align-items:center; justify-content:center; color: var(--ink-soft); }
.modal-close svg{ width:15px; height:15px; }

/* ---------- History list ---------- */
.hist-item{
  display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line);
  background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;
}
.hist-item:hover{ background: var(--paper-alt); }
.hist-item .hi-icon{ width:38px; height:38px; border-radius: var(--radius-sm); background: var(--brand-pale); color: var(--brand-dark); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.hist-item .hi-icon svg{ width:19px; height:19px; }
.hist-item .hi-main{ flex:1; min-width:0; }
.hist-item .hi-main .hi-title{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hist-item .hi-main .hi-sub{ font-size:12px; color: var(--ink-soft); font-family: var(--font-mono); }
.hist-item .hi-status{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:4px 8px; border-radius: var(--radius-pill); flex:0 0 auto; }
.hi-status.st-sent{ background: var(--forest-pale); color: var(--forest-dark); }
.hi-status.st-manual{ background: var(--amber-pale); color: var(--amber); }
.hi-status.st-draft{ background: var(--line); color: var(--ink-soft); }

.empty-state{ text-align:center; padding: 52px 20px; color: var(--ink-soft); }
.empty-state svg{ width:46px; height:46px; color: var(--line-strong); margin-bottom:14px; }
.empty-state h3{ font-size:15px; color: var(--ink); margin-bottom:6px; }
.empty-state p{ font-size:13px; max-width:280px; margin:0 auto; }

/* ---------- Rating (client feedback) ---------- */
.rate-row{ display:flex; gap:10px; }
.rate-btn{ flex:1; border:1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-md); padding:14px 6px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.rate-btn .rate-emoji{ font-size:26px; }
.rate-btn span{ font-size:11.5px; font-weight:700; color: var(--ink-soft); }
.rate-btn.is-picked{ border-color: var(--brand); background: var(--brand-pale); }
.rate-btn.is-picked span{ color: var(--brand-dark); }

/* ---------- Settings ---------- */
.status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 10px; border-radius: var(--radius-pill); }
.status-pill.ok{ background: var(--forest-pale); color: var(--forest-dark); }
.status-pill.off{ background: var(--line); color: var(--ink-soft); }
.status-pill svg{ width:12px; height:12px; }
.pill-mono{ font-family: var(--font-mono); font-size:11.5px; background: var(--paper); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }

/* ---------- Success / stamp ---------- */
.success-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; padding: 30px 10px 10px; }
.stamp{
  width:118px; height:118px; border-radius:50%; border:4px solid var(--forest);
  color: var(--forest); display:flex; align-items:center; justify-content:center;
  transform: scale(2.4) rotate(-14deg); opacity:0;
  animation: stampDown .55s cubic-bezier(.2,1.6,.4,1) .1s forwards;
}
.stamp svg{ width:56px; height:56px; }
@keyframes stampDown{ 0%{ transform: scale(2.4) rotate(-14deg); opacity:0; } 60%{ transform: scale(.94) rotate(-14deg); opacity:1;} 80%{ transform: scale(1.06) rotate(-14deg);} 100%{ transform: scale(1) rotate(-14deg); opacity:1; } }
.success-wrap h2{ margin-top:20px; font-size:20px; }
.success-wrap p{ color: var(--ink-soft); margin-top:6px; font-size:14px; max-width:320px; }

/* ---------- Accordion (7-Eleven scope of work) ---------- */
.acc-item{ margin-bottom:10px; }
.acc-head{ cursor:pointer; }

/* ---------- Auth screen (net new — same components as everything else) ---------- */
.auth-shell{ min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
.auth-card{ width:100%; max-width:380px; }
.auth-brand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; text-align:center; }
.auth-brand .brand-mark{ width:52px; height:52px; }
.auth-brand h1{ font-size:19px; }
.auth-brand h1 .brand-co{ color: var(--brand); }
.auth-brand p{ font-family: var(--font-mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color: var(--ink-faint); }
.auth-switch{ text-align:center; margin-top:16px; font-size:13px; color: var(--ink-soft); }
.auth-switch button{ background:none; border:none; color: var(--brand-dark); font-weight:700; padding:0; }
.auth-error{ background: var(--rust-pale); color: var(--rust-dark); border-radius: var(--radius-sm); padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:14px; }
.auth-notice{ background: var(--forest-pale); color: var(--forest-dark); border-radius: var(--radius-sm); padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:14px; }

/* ---------- Motion (Section 7) ---------- */
.qa-tile{ transition: background-color .12s ease, border-color .15s ease; }
.qa-tile:hover{ background: var(--paper-alt); }
.qa-tile > svg{ transition: transform .12s ease; }
.qa-tile:hover > svg{ transform: translateX(2px); }
.sidebar-link{ transition: background-color .18s ease, color .18s ease; }

.dash-hero, .type-grid .type-card, .panel-with-label, .quick-access-grid{
  animation: dashFadeUp .35s ease both;
}
.dash-hero{ animation-delay: 0ms; }
.type-grid .type-card:nth-child(1){ animation-delay: 60ms; }
.type-grid .type-card:nth-child(2){ animation-delay: 110ms; }
.type-grid .type-card:nth-child(3){ animation-delay: 160ms; }
.panel-with-label{ animation-delay: 220ms; }
.quick-access-grid{ animation-delay: 270ms; }
@keyframes dashFadeUp{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform: translateY(0); } }

.icon-btn.has-badge::after{ animation: badgePulse 1.6s ease-in-out infinite; }
@keyframes badgePulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.15); opacity:.7; } }

body, .app-header, .bottom-tab-bar, .app-sidebar, .card{
  transition: background-color .25s ease, border-color .25s ease, color .25s ease;
}

.tab-new-report{ transition: transform .15s ease; }
.tab-new-report:active{ transform: scale(.94); }

/* Pagination ("load more") */
.load-more-wrap{ display:flex; justify-content:center; padding:18px 0 4px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

/* ============================================================
   RESPONSIVE SHELL (Phase 2b)
   Breakpoint is 900px — not specified as an exact number anywhere
   in the brief (only "mobile" vs "desktop" mockups), so this is a
   chosen value, not a verified one. Both the sidebar and the bottom
   tab bar exist in the DOM at all times; only one is ever visible,
   toggled by .mobile-only / .desktop-only below rather than by

.desktop-only{ display:none; }

}

}
.tab-item svg{ width:22px; height:22px; }
.tab-item.is-active{ color: var(--brand); }
.tab-new-report{
  width:52px; height:52px; border-radius:50%; background: var(--brand); color:#fff;

}
:root[data-theme="dark"] .tab-new-report{ border-color: var(--paper); background: linear-gradient(155deg, #F76669 0%, #FF3131 35%, #B20000 100%); }
.tab-new-report svg{ width:24px; height:24px; }

@media(min-width:900px){

    display:flex; flex-direction:column; width:256px; flex:0 0 256px;
    padding:22px 16px; border-right:1px solid var(--line); background: var(--surface);

}

/* ---------- System Status (sidebar-pinned + full-card variants share this) ---------- */

"use strict";
/* ---------------- DOM / GENERAL UTILS — ported unchanged ---------------- */
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function escapeHTML(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowHM(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function formatDateDisplay(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
}
function formatTimeDisplay(hm){
  if(!hm) return '';
  const [h,m] = hm.split(':').map(Number);
  const ap = h>=12?'PM':'AM'; const h12 = ((h+11)%12)+1;
  return h12+':'+pad2(m)+' '+ap;
}
function formatDateTimeStamp(iso){
  const d = iso ? new Date(iso) : new Date();
  return d.toLocaleString('en-PH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function validateEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim()); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function fmtControlNo(type, n){
  const meta = TYPE_META[type];
  if(type==='private') return meta.docPrefix + String(n).padStart(meta.numLen,'0');
  return String(n);
}

/* ---------------- net-new: dataURL -> Blob, needed for Storage uploads ---------------- */
function dataURLToBlob(dataUrl){
  const parts = dataUrl.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function toast(message, kind){
  const root = qs('#toastRoot');
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='error' ? ' is-error' : kind==='success' ? ' is-success' : '');
  t.innerHTML = icon(kind==='error'?'alert':kind==='success'?'check':'info') + '<span>'+escapeHTML(message)+'</span>';
  root.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s ease, transform .25s ease'; t.style.opacity='0'; t.style.transform='translateY(-6px)'; setTimeout(()=>t.remove(), 260); }, 3400);
}

function openModal(innerHTML, opts){
  opts = opts || {};
  const root = qs('#modalRoot');
  root.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h3>'+escapeHTML(opts.title||'')+'</h3><button class="modal-close" id="modalCloseBtn" aria-label="Close">'+icon('x')+'</button></div>'+
    '<div id="modalBody">'+innerHTML+'</div></div></div>';
  qs('#modalCloseBtn').addEventListener('click', closeModal);
  qs('#modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  return qs('#modalBody');
}

  return '<div class="field"><label for="'+id+'">'+escapeHTML(label)+req+'</label>'+
    '<input class="input" type="'+type+'" id="'+id+'" value="'+escapeHTML(value||'')+'"'+ph+'>'+
    '<span class="err"></span></div>';
}
function fieldMini(label, id, value){

/* ---------------- SIGNATURE PAD — ported unchanged ---------------- */
/* (dark-mode legibility risk flagged in the audit doesn't apply yet —
   this pass stays light-only; Phase 2 needs to revisit ctx.strokeStyle
   when dark mode ships.) */
function setupSignatureCanvas(canvas){
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const cssWidth = canvas.clientWidth || 300;
  const cssHeight = canvas.clientHeight || 150;
  canvas.width = Math.round(cssWidth * ratio);
  canvas.height = Math.round(cssHeight * ratio);
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#16211B';
  let drawing = false, hasInk = false, last = null;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function down(e){
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    drawing = true; last = getPos(e); e.preventDefault();
  }
  function move(e){
    if(!drawing) return;
    const p = getPos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; hasInk = true; e.preventDefault();
  }
  function up(e){ drawing = false; }
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', up);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk = false; },
    isEmpty(){ return !hasInk; },
    markHasInk(){ hasInk = true; },
    dataURL(){ return canvas.toDataURL('image/png'); }
  };
}
function drawExistingSignature(canvas, sigApi, dataUrl){
  const img = new Image();
  img.onload = function(){
    const ctx = canvas.getContext('2d');
    const ratio = Math.max(window.devicePixelRatio||1,1);
    ctx.drawImage(img, 0, 0, canvas.width/ratio, canvas.height/ratio);
    sigApi.markHasInk();
  };
  img.src = dataUrl;
}

/* ---------------- PHOTO CAPTURE + RESIZE — ported unchanged ---------------- */
function readAndResizeImage(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.82;
  return new Promise(function(resolve, reject){
    if(!file || !file.type || file.type.indexOf('image/') !== 0){
      reject(new Error('That file isn\u2019t an image.')); return;
    }
    const reader = new FileReader();
    reader.onerror = function(){ reject(new Error('Could not read that photo. Try again.')); };
    reader.onload = function(){
      const img = new Image();
      img.onerror = function(){ reject(new Error('That photo could not be opened.')); };
      img.onload = function(){
        let width = img.width, height = img.height;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const { data, error } = await sb.from('reports').select('type, satisfaction, email_status, technician_id, created_at, status').eq('status','submitted');
  if(error){ console.error('getReportsForAnalytics failed', error); throw error; }
  return data;
}

async function saveNotificationPrefs(userId, prefs){
  const { error } = await sb.from('profiles').update({ notification_prefs: prefs }).eq('id', userId);
  if(error) throw error;
}

async function saveThemePreference(userId, theme){
  const { error } = await sb.from('profiles').update({ theme_preference: theme }).eq('id', userId);
  if(error) throw error;
}

async function getAppSettings(){
  const { data, error } = await sb.from('app_settings').select('*').eq('id', 1).single();
  if(error){ console.error('getAppSettings failed', error); return null; }
  return data;
}
async function saveAppSettings(patch){
  const { error } = await sb.from('app_settings').update(patch).eq('id', 1);
  if(error) throw error;
}

"use strict";
/* ============================================================
   PDF GENERATION (jsPDF + autoTable) — ported unchanged.
   headStyles.fillColor below is [31,92,70], the RGB of --forest,
   hardcoded because jsPDF can't read CSS variables. Logged
   assumption from the audit: the printed/emailed document keeps
   this identity regardless of any future in-app theme change —
   Section 4 only re-scopes on-screen interactive color. Say so if
   client-facing PDFs should pick up the red brand too.
   ============================================================ */
function drawLetterhead(doc, d){
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(31,92,70);
  doc.rect(0,0,pageWidth,66,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(CONFIG.companyName.toUpperCase(), 40, 28);
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(CONFIG.companyAddress, 40, 41);
  doc.text(CONFIG.companyPhone + '   \u2022   ' + CONFIG.companyEmail, 40, 53);

  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  doc.text((TYPE_META[d.type].label).toUpperCase(), pageWidth-40, 24, { align:'right' });
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.text('JOB ACCOMPLISHMENT REPORT', pageWidth-40, 34, { align:'right' });
  doc.setFont('courier','bold'); doc.setFontSize(14);
  doc.text(d.controlDisplay || '', pageWidth-40, 53, { align:'right' });

  doc.setTextColor(20,30,25);
  return 90;
}
function sectionHeading(doc, text, y){
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  if(y > pageHeight - 100){ doc.addPage(); y = 50; }
  doc.setFillColor(220,234,226);
  doc.rect(40, y, pageWidth-80, 18, 'F');
  doc.setTextColor(18,58,44);
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(text.toUpperCase(), 46, y+12.5);
  doc.setTextColor(20,30,25);
  return y + 18 + 8;
}
function kvTable(doc, y, rows){
  doc.autoTable({
    startY: y,
    body: rows.map(function(r){ return [r[0], r[1] || '\u2014']; }),
    theme: 'plain',
    margin: { top:50, left:40, right:40 },
    styles: { font:'helvetica', fontSize:9, cellPadding:{top:3,bottom:3,left:0,right:6}, textColor:[20,30,25], overflow:'linebreak' },
    columnStyles: { 0:{ fontStyle:'bold', textColor:[85,100,91], cellWidth:150 }, 1:{} }
  });
  return doc.lastAutoTable.finalY + 16;
}
function gridTable(doc, y, head, body, colStyles){
  doc.autoTable({
    startY: y,
    head: [head],
    body: body,
    margin: { top:50, left:40, right:40 },
    styles: { font:'helvetica', fontSize:7.6, cellPadding:4, textColor:[20,30,25], overflow:'linebreak', valign:'top' },
    headStyles: { fillColor:[31,92,70], textColor:[255,255,255], fontStyle:'bold', fontSize:7.6 },
    alternateRowStyles: { fillColor:[239,243,238] },
    columnStyles: colStyles || {}
  });
  return doc.lastAutoTable.finalY + 16;
}
function pdfServicePrivate(doc, d, y){
  return kvTable(doc, y, [
    ['Services performed', d.service.typesOfServices.join(', ') || '\u2014'],
    ['Active pest observed', (d.service.activePests.concat(d.service.activePestOther?[d.service.activePestOther]:[])).join(', ') || '\u2014'],
    ['Degree of infestation', d.service.degreeOfInfestation || '\u2014'],
    ['Chemical used', d.service.chemicalUsed || '\u2014']
  ]);
}
function pdfServiceSeven11(doc, d, y){
  const rows = SEVEN11_AREAS.map(function(a,i){
    const r = d.service.scopeRows['a'+i] || {};
    const pests = r.pests || (r.pest ? [r.pest] : []);
    const pestLabel = pests.map(function(p){ return (p==='Others' && r.pestOther) ? r.pestOther : p; }).join(', ');
    return [a, pestLabel, r.severity||''];
  });
  y = gridTable(doc, y, ['Area','Pest spotted','Severity'], rows, {0:{cellWidth:120}});
  y = kvTable(doc, y, [
    ['Services rendered', d.service.servicesRendered],
    ['Chemicals applied', d.service.chemicalUsed],
    ['Dilution (mL/L)', d.service.dilution],
    ['Brand', d.service.brand]
  ]);
  y = kvTable(doc, y, [['Weather condition', d.service.weather]]);
  y = sectionHeading(doc, 'Other Parameters of Concern', y);
  const otherRows = SEVEN11_OTHER_PARAMS.map(function(row,i){
    const r = d.service.otherParams['o'+i] || {};
    return [row, r.remarks||'', r.recommendation||''];
  });
  y = gridTable(doc, y, ['Item','Remarks','Recommendation'], otherRows, {0:{cellWidth:160}});
  return y;
}
function pdfServiceGovernment(doc, d, y){
  y = kvTable(doc, y, [
    ['Nature of work', d.service.natureOfWork.join(', ')],
    ['Pests noted', d.service.gpcPests.join(', ')],
    ['Action taken', d.service.actionTaken.join(', ')],
    ['Areas treated', d.service.areasTreated.join(', ')],
    ['Rodent entry point', d.service.rodentEntryPoint],
    ['Barriers / sealing', d.service.sealing],
    ['Sanitation needs', d.service.sanitationNeeds],
    ['Repair & maintenance', d.service.repairMaintenance],
    ['Renovation notes', d.service.renovation],
    ['Chemical used', d.service.chemicalUsed]
  ]);
  y = sectionHeading(doc, 'Findings \u2014 Degree of Infestation', y);
  const findRows = GOV_FINDINGS_PESTS.map(function(p,i){
    const r = d.findings.byPest['p'+i] || {};
    return [p, r.severity || '\u2014'];
  });
  y = gridTable(doc, y, ['Pest','Severity (Light / Medium / High)'], findRows, {});
  return y;
}
function pdfPhotos(doc, d, y){
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const cols = 3, gap = 10;
  const imgW = (pageWidth - 80 - gap*(cols-1)) / cols;
  const imgH = imgW * 0.75;
  let rowStartY = y, col = 0, x;
  d.photos.forEach(function(p){
    if(col===0 && rowStartY + imgH > pageHeight - 70){ doc.addPage(); rowStartY = 50; }
    x = 40 + col * (imgW+gap);
    try{ doc.addImage(p.dataUrl, 'JPEG', x, rowStartY, imgW, imgH, undefined, 'FAST'); }catch(e){}
    col++;
    if(col>=cols){ col=0; rowStartY += imgH + gap; }
  });
  if(col!==0) rowStartY += imgH + gap;
  return rowStartY + 8;
}
function pdfSignoff(doc, d, y){
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const colW = (pageWidth - 80 - 20) / 2;
  const sigH = 60;
  if(y + sigH + 70 > pageHeight - 70){ doc.addPage(); y = 50; }
  const leftX = 40, rightX = 40 + colW + 20;
  doc.setDrawColor(214,222,211);
  doc.rect(leftX, y, colW, sigH);
  doc.rect(rightX, y, colW, sigH);
  if(d.signOff.technicianSig){ try{ doc.addImage(d.signOff.technicianSig,'PNG', leftX+6, y+6, colW-12, sigH-12, undefined,'FAST'); }catch(e){} }
  if(d.signOff.clientSig){ try{ doc.addImage(d.signOff.clientSig,'PNG', rightX+6, y+6, colW-12, sigH-12, undefined,'FAST'); }catch(e){} }
  const labelY = y + sigH + 14;
  doc.setDrawColor(180,190,182);
  doc.line(leftX, labelY-6, leftX+colW, labelY-6);
  doc.line(rightX, labelY-6, rightX+colW, labelY-6);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(60,70,62);
  doc.text((d.signOff.technicianName||'\u2014') + '  \u2014  Service Technician', leftX, labelY+4);
  doc.text((d.signOff.clientRepName||'\u2014') + '  \u2014  Client Representative', rightX, labelY+4);

  let yy = labelY + 26;
  const satisfactionText = d.signOff.satisfaction ? satisfactionLabel(d.signOff.satisfaction) : 'Not rated';
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(20,30,25);
  doc.text('Client satisfaction: ' + satisfactionText, leftX, yy);
  yy += 16;
  if(d.signOff.clientRemarks){
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    const lines = doc.splitTextToSize('Client remarks: ' + d.signOff.clientRemarks, pageWidth-80);
    doc.text(lines, leftX, yy);
    yy += lines.length*11;
  }
  return yy + 10;
}
function drawContinuationHeader(doc, d){
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(31,92,70);
  doc.text(CONFIG.companyName + '  \u2014  ' + (d.controlDisplay||''), 40, 28);
  doc.setDrawColor(214,222,211); doc.line(40,36,pageWidth-40,36);
  doc.setTextColor(20,30,25);
}
function drawFooter(doc, d, pageNum, total){
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setDrawColor(214,222,211); doc.line(40, pageHeight-34, pageWidth-40, pageHeight-34);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(120,130,122);
  doc.text('Generated ' + formatDateTimeStamp(d.submittedAt||new Date().toISOString()), 40, pageHeight-22);
  doc.text('Page ' + pageNum + ' of ' + total, pageWidth-40, pageHeight-22, { align:'right' });
}
function finalizeAllPages(doc, d){
  const total = doc.internal.getNumberOfPages();
  for(let p=1; p<=total; p++){
    doc.setPage(p);
    if(p>1){ drawContinuationHeader(doc, d); }
    drawFooter(doc, d, p, total);
  }
}
function buildPDF(d){
  const jsPDFCtor = window.jspdf.jsPDF;
  const doc = new jsPDFCtor({ unit:'pt', format:'a4' });
  let y = drawLetterhead(doc, d);

  y = sectionHeading(doc, 'Client & Schedule', y);
  y = kvTable(doc, y, clientKV(d, d.type));

  y = sectionHeading(doc, 'Service Details', y);
  if(d.type==='private') y = pdfServicePrivate(doc, d, y);
  else if(d.type==='seven11') y = pdfServiceSeven11(doc, d, y);
  else y = pdfServiceGovernment(doc, d, y);

  y = sectionHeading(doc, 'Findings, Recommendation & Remarks', y);
  y = kvTable(doc, y, concernKV(d, d.type));

  if(d.photos && d.photos.length){
    y = sectionHeading(doc, 'Photo Evidence', y);
    y = pdfPhotos(doc, d, y);
  }

  y = sectionHeading(doc, 'Sign-off', y);
  y = pdfSignoff(doc, d, y);

  finalizeAllPages(doc, d);
  return doc;
}

"use strict";
/* ============================================================
   EMAIL DELIVERY — EmailJS (auto) with mailto fallback (guaranteed)
   Ported unchanged. Still loaded from jsdelivr in index.html, same
   as the original — the audit found that CDN unreliable inside a
   Claude artifact sandbox, but this app isn't one anymore, so that
   constraint no longer applies. The mailto fallback stays regardless,
   since it was never just a workaround — it's the guaranteed path
   when a technician hasn't configured EmailJS at all.
   ============================================================ */
let pendingMailto = null;

function buildEmailSummary(d){
  const meta = TYPE_META[d.type];
  const clientDisplayName = d.client.name || d.client.storeName || 'Client';
  const subject = 'Job Accomplishment Report ' + d.controlDisplay + ' \u2014 ' + clientDisplayName;
  const lines = [];
  lines.push('JOB ACCOMPLISHMENT REPORT \u2014 ' + d.controlDisplay);
  lines.push(meta.label);
  lines.push('');
  lines.push('Client: ' + clientDisplayName);
  lines.push('Address: ' + (d.client.address||''));
  lines.push('Service date: ' + formatDateDisplay(d.schedule.serviceDate));
  lines.push('Technician: ' + (d.signOff.technicianName||''));
  lines.push('');
  if(d.type==='private'){
    lines.push('Services: ' + d.service.typesOfServices.join(', '));
    lines.push('Pests observed: ' + d.service.activePests.join(', '));
    lines.push('Degree of infestation: ' + (d.service.degreeOfInfestation||'\u2014'));
  } else if(d.type==='seven11'){
    lines.push('Weather during application: ' + (d.service.weather||'\u2014'));
  } else {
    lines.push('Nature of work: ' + d.service.natureOfWork.join(', '));
    lines.push('Pests noted: ' + d.service.gpcPests.join(', '));
  }
  lines.push('');
  if(d.concern.finding) lines.push('Finding: ' + d.concern.finding);
  if(d.concern.recommendation) lines.push('Recommendation: ' + d.concern.recommendation);
  if(d.concern.remarks) lines.push('Remarks: ' + d.concern.remarks);
  lines.push('');
  lines.push('\u2014 Sent via the ' + CONFIG.companyName + ' Job Accomplishment Report system.');
  lines.push('The complete report with photos and signatures is available as a PDF \u2014 download it from the app to attach or forward.');
  return { subject: subject, body: lines.join('\n') };
}
function preparePendingMailto(d, summary){
  const bodyForMailto = summary.body.length > 1500 ? (summary.body.slice(0,1450) + '\n\n[Full details are in the PDF \u2014 download and attach it before sending.]') : summary.body;
  const cc = d.client.ccEmail ? ('&cc=' + encodeURIComponent(d.client.ccEmail)) : '';
  pendingMailto = 'mailto:' + encodeURIComponent(d.client.email) + '?subject=' + encodeURIComponent(summary.subject) + cc + '&body=' + encodeURIComponent(bodyForMailto);
}
async function attemptSend(d){
  const summary = buildEmailSummary(d);
  const emailJsReady = (typeof emailjs !== 'undefined') && state.settings.configured && state.settings.serviceId && state.settings.templateId && state.settings.publicKey;
  if(emailJsReady){
    try{
      await emailjs.send(state.settings.serviceId, state.settings.templateId, {
        to_email: d.client.email,
        cc_email: d.client.ccEmail || '',
        from_name: state.settings.fromName || CONFIG.companyName,
        subject: summary.subject,
        report_id: d.controlDisplay,
        client_name: d.client.name || d.client.storeName || '',
        technician_name: d.signOff.technicianName || '',
        message: summary.body
      }, { publicKey: state.settings.publicKey });
      return { status:'sent' };
    } catch(err){
      console.error('EmailJS send failed', err);
      preparePendingMailto(d, summary);
      return { status:'manual' };
    }
  } else {
    preparePendingMailto(d, summary);
    return { status:'manual' };
  }
}

function buildStepClient(container){
  const d = state.draft;
  const type = state.reportType;
  let html = '';

  html += '<div class="field" id="acctPickerField">';
  if(d.accountId){
    html += '<div class="helper-banner" style="margin-bottom:0;">'+icon('briefcase')+'<span>Linked to an existing account. <button type="button" id="unlinkAcctBtn" style="background:none;border:none;color:var(--brand-dark);font-weight:700;padding:0;">Unlink & edit manually</button></span></div>';
  } else {
    html += '<label>Search an existing account (optional)</label>'+
      '<input class="input" id="acctSearchInput" placeholder="Search by account or store name\u2026" autocomplete="off">'+
      '<div id="acctSearchResults"></div>';
  }
  html += '</div>';

  if(type==='seven11'){
    html += '<div class="row-2">'+
      field('Store number', 'f_storeNumber', 'text', d.client.storeNumber, {required:true, placeholder:'e.g. 3021'}) +
      field('Store name', 'f_storeName', 'text', d.client.storeName, {required:true, placeholder:'e.g. 7-Eleven Katipunan'}) +
    '</div>';
    html += '<div class="row-2">'+
      field('Store cluster', 'f_storeCluster', 'text', d.client.storeCluster, {placeholder:'e.g. Cluster 4'}) +
      field('Name of store manager', 'f_storeManager', 'text', d.client.storeManager, {placeholder:'e.g. Juan Dela Cruz'}) +
    '</div>';
    html += field('Store address', 'f_address', 'text', d.client.address, {required:true, placeholder:'Complete store address'});
  } else if(type==='government'){
    html += field('Client / institution name', 'f_name', 'text', d.client.name, {required:true, placeholder:'e.g. Quezon City Hall'});
    html += field('Address', 'f_address', 'text', d.client.address, {required:true, placeholder:'Complete site address'});
    html += '<div class="row-2">'+
      field('Contact person', 'f_contactPerson', 'text', d.client.contactPerson, {placeholder:'Name of on-site contact'}) +
      field('Tel. number', 'f_phone', 'tel', d.client.phone, {placeholder:'Landline or mobile'}) +
    '</div>';
    html += '<div class="field"><label>Type of structure</label><div class="chip-group" id="structureChips">'+
      ['Residential','Commercial Establishment'].map(function(s){ return chipHTML(s, d.client.structureType===s); }).join('') +
    '</div></div>';
    html += field('Nature of business (if commercial)', 'f_natureOfBusiness', 'text', d.client.natureOfBusiness, {placeholder:'e.g. Retail, warehousing, office'});
  } else {
    html += field('Company / property name', 'f_name', 'text', d.client.name, {required:true, placeholder:'e.g. Sea Residences'});
    html += field('Address', 'f_address', 'text', d.client.address, {required:true, placeholder:'Complete property address'});
    html += '<div class="row-2">'+
      field('Contact person', 'f_contactPerson', 'text', d.client.contactPerson, {placeholder:'Name of on-site contact'}) +
      field('Phone', 'f_phone', 'tel', d.client.phone, {placeholder:'Mobile number'}) +
    '</div>';
  }

  html += '<hr class="hairline">';
  html += '<div class="helper-banner"><span style="display:flex;">'+icon('mail')+'</span><span>The finished report is sent to this address automatically \u2014 double-check it before continuing.</span></div>';
  html += '<div class="row-2">'+
    field('Client email', 'f_email', 'email', d.client.email, {required:true, placeholder:'client@email.com'}) +
    field('CC email (optional)', 'f_ccEmail', 'email', d.client.ccEmail, {placeholder:'office@gepestcon.co'}) +
  '</div>';

  html += '<hr class="hairline">';
  html += '<div class="row-2">'+
    field('Service schedule', 'f_serviceDate', 'date', d.schedule.serviceDate, {required:true}) +
    field('Actual date of service', 'f_actualDate', 'date', d.schedule.actualDate, {}) +
  '</div>';
  html += '<div class="row-2">'+
    field('Time started', 'f_timeStarted', 'time', d.schedule.timeStarted, {}) +
    field('Time finished', 'f_timeFinished', 'time', d.schedule.timeFinished, {}) +
  '</div>';

  container.innerHTML = html;

  if(d.accountId){
    qs('#unlinkAcctBtn', container).addEventListener('click', function(){
      d.accountId = null;
      buildStepClient(container);
    });

        qsa('#structureChips .chip', container).forEach(function(x){ x.classList.remove('is-on'); });
        c.classList.add('is-on');
      });
    });
  }
}

  d.schedule.serviceDate = val('f_serviceDate') || todayISO();

  d.schedule.timeFinished = val('f_timeFinished');

  const nameOk = type==='seven11' ? d.client.storeName : d.client.name;

    const fid = type==='seven11' ? 'f_storeName' : 'f_name';
    markFieldError(fid, 'This is required.');
    return { valid:false, message: type==='seven11' ? 'Enter the store name to continue.' : 'Enter the client / property name to continue.' };
  }
  if(!d.client.address){ markFieldError('f_address','This is required.'); return { valid:false, message:'Enter the site address to continue.' }; }

    markFieldError('f_email','Enter a valid email address.');

  return { valid:true };
}

function renderPhotoStepBody(container, d){
  let html = '<div class="helper-banner">'+icon('camera')+'<span>Attach photos of the treated area, pest activity, or damage. These are embedded in the PDF report sent to the client.</span></div>';
  html += '<div class="photo-grid" id="photoGrid">';
  d.photos.forEach(function(p,i){
    html += '<div class="photo-tile"><img src="'+p.dataUrl+'" alt="Evidence photo '+(i+1)+'"><button type="button" class="photo-remove" data-idx="'+i+'" aria-label="Remove photo '+(i+1)+'">'+icon('x')+'</button></div>';
  });
  if(d.photos.length < 6){
    html += '<label class="photo-add" id="photoAddBtn"><input type="file" accept="image/*" id="photoInput" style="display:none;" multiple>'+icon('camera')+'<span>Add photo</span></label>';
  }
  html += '</div>';
  html += '<p class="small-muted" style="margin-top:12px;">'+d.photos.length+' of 6 photos added \u2014 resized automatically to keep the report light.</p>';
  container.innerHTML = html;

  const input = qs('#photoInput', container);
  if(input){
    input.addEventListener('change', async function(e){
      const files = Array.from(e.target.files || []);
      for(let i=0;i<files.length;i++){
        if(d.photos.length >= 6){ toast('Maximum of 6 photos per report.', 'error'); break; }
        try{
          const dataUrl = await readAndResizeImage(files[i]);
          d.photos.push({ id: uid(), dataUrl: dataUrl, caption:'' });
        } catch(err){ toast(err.message || 'Could not add that photo.', 'error'); }
      }
      renderPhotoStepBody(container, d);
    });
  }
  qsa('.photo-remove', container).forEach(function(btn){
    btn.addEventListener('click', function(){
      const idx = parseInt(btn.dataset.idx,10);
      d.photos.splice(idx,1);
      renderPhotoStepBody(container, d);
    });
  });
}

   WIZARD SHELL + NAVIGATION — ported unchanged
   ============================================================ */
function renderWizard(){
  const wrap = document.createElement('div');
  const stepKey = WIZARD_STEPS[state.step];
  const meta = TYPE_META[state.reportType];
  let top = '<div class="wizard-top">'+
    '<button class="back-link" id="wizBack">'+icon('chevronLeft')+' '+(state.step===0?'Cancel':'Back')+'</button>'+
    '<span class="step-tag">'+meta.short+' \u00B7 STEP '+(state.step+1)+' / '+WIZARD_STEPS.length+'</span>'+
  '</div>';
  let rail = '<div class="step-rail">' + WIZARD_STEPS.map(function(s,i){
    const cls = i < state.step ? 'is-done' : i === state.step ? 'is-current' : '';
    return '<i class="'+cls+'"></i>';
  }).join('') + '</div>';

  let card = '<div class="card"><h2 class="section-title">'+STEP_LABELS[stepKey]+'</h2>'+
    '<p class="section-hint">'+stepHintText(stepKey, state.reportType)+'</p>'+
    '<div id="stepBody"></div></div>';

  wrap.innerHTML = top + rail + card;
  qs('#wizBack', wrap).addEventListener('click', onWizardBack);

  const body = qs('#stepBody', wrap);
  const builders = { client: buildStepClient, service: buildStepService, photos: buildStepPhotos, concern: buildStepConcern, signoff: buildStepSignoff };
  builders[stepKey](body);

  setFooterBar(
    (state.step>0 ? '<button class="btn btn-secondary btn-lg" id="wizPrev">Back</button>' : '') +
    '<button class="btn btn-primary btn-lg btn-block" id="wizNext">'+(state.step===WIZARD_STEPS.length-1 ? 'Review report' : 'Continue')+' '+icon('chevronRight')+'</button>'
  );
  qs('#wizNext').addEventListener('click', onWizardNext);
  if(state.step>0) qs('#wizPrev').addEventListener('click', onWizardPrev);

  return wrap;
}
function onWizardNext(){
  const stepKey = WIZARD_STEPS[state.step];
  const result = saveCurrentStepIntoDraft(stepKey);
  if(result && result.valid === false){
    if(result.message) toast(result.message, 'error');
    return;
  }
  persistDraft();
  if(state.step < WIZARD_STEPS.length-1){
    state.step++;
    render(); window.scrollTo(0,0);
  } else {
    navigate('review');
  }
}
function onWizardPrev(){
  const stepKey = WIZARD_STEPS[state.step];
  saveCurrentStepIntoDraft(stepKey);
  persistDraft();
  state.step--;
  render(); window.scrollTo(0,0);
}
function onWizardBack(){
  if(state.step===0){
    const body = openModal(
      '<p style="font-size:14px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;">This report hasn\u2019t been sent yet. Leaving now discards everything you\u2019ve entered.</p>'+
      '<div style="display:flex;gap:10px;">'+
        '<button class="btn btn-secondary btn-block" id="cancelDiscard">Keep editing</button>'+
        '<button class="btn btn-danger btn-block" id="confirmDiscard">Discard</button>'+
      '</div>', { title:'Discard this report?' }
    );
    qs('#cancelDiscard').addEventListener('click', closeModal);
    qs('#confirmDiscard').addEventListener('click', function(){
      closeModal();
      clearDraftStorage();
      state.draft=null; state.reportType=null; state.step=0;
      navigate('home');
    });
  } else {
    onWizardPrev();
  }
}

 * allowing a one-off, account-less entry." This is the shared prefill
 * used both by that in-wizard picker and by "Start report" on an
 * Account Detail page.
 */
function applyAccountToDraft(account, draft){
  draft.accountId = account.id;
  draft.client.name = account.name || '';
  draft.client.address = account.address || '';
  draft.client.phone = account.phone || '';
  draft.client.email = account.email || '';
  if(account.type==='seven11'){
    draft.client.storeNumber = account.store_number || '';
    draft.client.storeName = account.store_name || account.name || '';
    draft.client.storeCluster = account.store_cluster || '';
    draft.client.storeManager = account.store_manager || '';
  } else if(account.type==='government'){
    draft.client.natureOfBusiness = account.nature_of_business || '';
  }
}
function startReportFromAccount(account){
  state.reportType = account.type;

/* ---------------- DRAFT PERSISTENCE (personal, lightweight) ----------------
   Was window.storage with shared:false (per device); now that this runs as
   a normal deployed page rather than a Claude artifact, plain localStorage
   is available and does the same "per device" job without a network round
   trip on every step. */
const DRAFT_STORAGE_KEY = 'gepestcon_draft_active';
function persistDraft(){
  if(!state.draft) return;
  try{ localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify({ reportType: state.reportType, step: state.step, draft: state.draft })); }
  catch(e){ console.error('persistDraft failed', e); }
}
function clearDraftStorage(){ try{ localStorage.removeItem(DRAFT_STORAGE_KEY); }catch(e){} }
function checkForSavedDraft(){
  let saved = null;
  try{ const raw = localStorage.getItem(DRAFT_STORAGE_KEY); saved = raw ? JSON.parse(raw) : null; }
  catch(e){ saved = null; }
  if(!saved || !saved.draft) return;
  const body = openModal(
    '<p style="font-size:14px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;">You have an unfinished '+escapeHTML((TYPE_META[saved.reportType]||{}).label||'')+' report from a previous session. Resume it or start fresh.</p>'+

  qs('#discardSaved').addEventListener('click', function(){ closeModal(); clearDraftStorage(); });
  qs('#resumeSaved').addEventListener('click', function(){

/* ============================================================
   SUBMIT REPORT
   This is the one function that genuinely changes shape, not just
   storage target. Sequence, and why:
     1. Claim the control number FIRST, via the atomic RPC \u2014 root
        fix for defect #1.
     2. Insert the report row next, so there's a real id to hang
        photos/signatures/PDF off of in Storage.
     3. Upload photos + signatures (still in-memory dataURLs from the
        wizard) now that we have somewhere to put them \u2014 decision #4.
     4. Build the PDF exactly as before, then upload THOSE bytes and
        store the path \u2014 the actual fix for defect #5, only possible
        now that real file storage exists.
     5. Patch the row with the Storage paths.
     6. Email \u2014 identical behavior to today: EmailJS if configured,
        mailto fallback otherwise.
   If any step throws, nothing has navigated away and the button
   re-enables \u2014 same recovery behavior as the original.
   ============================================================ */
let lastSubmittedPdfBlobUrl = null;
let lastSubmittedReport = null;

async function submitReport(){
  const btn = qs('#sendReportBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = 'Sending\u2026'; }
  const d = state.draft;
  const type = state.reportType;

  if(typeof DEV_SKIP_AUTH !== 'undefined' && DEV_SKIP_AUTH){
    // Preview mode (no real signed-in user): nextControlNumber/insertReport/
    // uploadFile/attemptSend all need a real Supabase session and would just
    // be rejected by the database's row-level security \u2014 so skip them
    // entirely here rather than let that show up as a confusing error.
    // Building the PDF is pure client-side (jsPDF), so that part is real.
    try{
      d.controlNo = 0;
      d.controlDisplay = 'PREVIEW-' + new Date().toISOString().slice(0,10).replace(/-/g,'');
      d.submittedAt = new Date().toISOString();
      const pdfDoc = buildPDF(d);
      const pdfBlob = pdfDoc.output('blob');
      if(lastSubmittedPdfBlobUrl) URL.revokeObjectURL(lastSubmittedPdfBlobUrl);
      lastSubmittedPdfBlobUrl = URL.createObjectURL(pdfBlob);
      lastSubmittedReport = d;
      state.draft = null;
      clearDraftStorage();
      toast('Preview only \u2014 nothing was saved or emailed while sign-in is off.', 'info');
      navigate('success');
    } catch(err){
      console.error(err);
      toast('Could not build the preview PDF: ' + (err.message||'unknown error'), 'error');
      if(btn){ btn.disabled = false; btn.innerHTML = icon('send') + ' Send report'; }
    }
    return;
  }

  try{
    const controlNo = await nextControlNumber(type);
    d.controlNo = controlNo;
    d.controlDisplay = fmtControlNo(type, controlNo);
    d.submittedAt = new Date().toISOString();
    d.status = 'submitted';

    const { data: row, error: insertErr } = await insertReport({
      control_no: controlNo,
      control_display: d.controlDisplay,
      type: type,
      status: 'submitted',
      account_id: d.accountId || null,
      technician_id: state.profile.id,
      service_date: d.schedule.serviceDate || null,
      actual_date: d.schedule.actualDate || null,
      time_started: d.schedule.timeStarted || null,
      time_finished: d.schedule.timeFinished || null,
      client: d.client,
      service: d.service,
      findings: d.findings,
      concern: d.concern,
      sign_off: { technicianName: d.signOff.technicianName, clientRepName: d.signOff.clientRepName, satisfaction: d.signOff.satisfaction, clientRemarks: d.signOff.clientRemarks },
      photos: [],
      satisfaction: d.signOff.satisfaction || null,
      email_status: 'draft',
      submitted_at: d.submittedAt
    });
    if(insertErr) throw insertErr;
    d.id = row.id;

    const photoRecords = [];
    for(let i=0;i<d.photos.length;i++){
      const path = 'reports/'+d.id+'/photos/'+(i+1)+'.jpg';
      await uploadFile(path, dataURLToBlob(d.photos[i].dataUrl), 'image/jpeg');
      photoRecords.push({ path: path, caption: d.photos[i].caption||'' });
    }
    let techSigPath = null, clientSigPath = null;
    if(d.signOff.technicianSig){
      techSigPath = 'reports/'+d.id+'/signatures/technician.png';
      await uploadFile(techSigPath, dataURLToBlob(d.signOff.technicianSig), 'image/png');
    }
    if(d.signOff.clientSig){
      clientSigPath = 'reports/'+d.id+'/signatures/client.png';
      await uploadFile(clientSigPath, dataURLToBlob(d.signOff.clientSig), 'image/png');
    }

    const pdfDoc = buildPDF(d);
    const pdfBlob = pdfDoc.output('blob');
    const pdfPath = 'reports/'+d.id+'/report.pdf';
    await uploadFile(pdfPath, pdfBlob, 'application/pdf');
    if(lastSubmittedPdfBlobUrl) URL.revokeObjectURL(lastSubmittedPdfBlobUrl);
    lastSubmittedPdfBlobUrl = URL.createObjectURL(pdfBlob);

    const sendResult = await attemptSend(d);
    d.emailStatus = sendResult.status;

    await updateReport(d.id, {
      photos: photoRecords,
      sign_off: { technicianName: d.signOff.technicianName, technicianSigPath: techSigPath, clientRepName: d.signOff.clientRepName, clientSigPath: clientSigPath, satisfaction: d.signOff.satisfaction, clientRemarks: d.signOff.clientRemarks },
      pdf_path: pdfPath,
      email_status: sendResult.status
    });

    createNotification({ type:'report_submitted', title:'Report ' + d.controlDisplay + ' submitted', body:(d.client.name||d.client.storeName||'Client') + ' \u2014 ' + TYPE_META[type].label, report_id: d.id });
    if(sendResult.status === 'manual'){
      createNotification({ type:'email_manual_fallback', title:'Email needs manual send \u2014 ' + d.controlDisplay, body:'Automatic email wasn\u2019t available for this report. Download the PDF from Report Detail and forward it.', report_id: d.id });
    }

    clearDraftStorage();
    lastSubmittedReport = d;
    if(pendingVisitId){
      try{ await updateVisit(pendingVisitId, { status:'completed', report_id: d.id }); }
      catch(err){ console.error('Could not link visit to report', err); }
      pendingVisitId = null;
    }
    state.draft = null;
    navigate('success');
  } catch(err){
    console.error(err);
    toast('Something went wrong while sending. Nothing was lost \u2014 try again.', 'error');
    if(btn){ btn.disabled = false; btn.innerHTML = icon('send') + ' Send report'; }
  }
}

async function loadHistoryPage(target, reset){
  if(reset){ __histState.page = 0; __histState.rows = []; }
  let rows, count;
  try{ ({ rows, count } = await listReportsPage({ page: __histState.page, search: __histState.search, type: __histState.type })); }
  catch(err){
    target.innerHTML = errorStateHTML(err.message);
    qs('#retryLoadBtn', target).addEventListener('click', function(){ loadHistoryPage(target, reset); });
    return;
  }
  __histState.rows = reset ? rows : __histState.rows.concat(rows);
  __histState.count = count;
  renderHistList(target);
}

function renderHistList(target){
  if(!target) return;
  if(__histState.rows.length===0){
    target.innerHTML = '<div class="empty-state">'+icon('inbox')+'<h3>No reports found</h3><p>Try a different search, or submit your first report from the home screen.</p></div>';
    return;
  }
  let html = '<div class="card" style="padding:2px 14px;">' + __histState.rows.map(historyItemHTML).join('') + '</div>';
  const hasMore = __histState.rows.length < __histState.count;
  if(hasMore){
    html += '<div class="load-more-wrap"><button class="btn btn-secondary" id="histLoadMore">Load more ('+(__histState.count - __histState.rows.length)+' remaining)</button></div>';
  }
  target.innerHTML = html;
  qsa('.hist-item', target).forEach(function(el){
    el.addEventListener('click', function(){ navigate('reportDetail', { viewingReportId: el.dataset.id }); });
  });
  const loadMoreBtn = qs('#histLoadMore', target);
  if(loadMoreBtn){
    loadMoreBtn.addEventListener('click', function(){
      loadMoreBtn.disabled = true; loadMoreBtn.textContent = 'Loading\u2026';
      __histState.page += 1;
      loadHistoryPage(target, false);
    });
  }
}

  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

"use strict";
/* ============================================================
   SERVICES (Phase 4) — recurring contracts per account
   Built to the brief's own "best-supported default" after being
   flagged as needing confirmation twice with no answer back. If
   Gepestcon actually sells one-off treatments rather than recurring
   contracts, this whole module (not just a field or two) is the
   wrong shape — see supabase/schema.sql's comment on this table.

   "Schedule next visit" is the connective tissue to Schedule that
   Section 9 describes ("this is what makes Schedule generate real
   visits") without needing a real scheduled job: it opens Schedule's
   visit form pre-filled with this contract's account and next-due
   date, and on save, advances next_due_date by one cycle.
   ============================================================ */
const FREQUENCY_DAYS = { weekly:7, biweekly:14, monthly:30, quarterly:91, annual:365 };
function addDaysISO(iso, days){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function frequencyLabel(f){
  return { weekly:'Weekly', biweekly:'Every 2 weeks', monthly:'Monthly', quarterly:'Quarterly', annual:'Annually' }[f] || f;
}
function serviceRowHTML(s){
  const acctName = s.accounts ? (s.accounts.name || TYPE_META[s.accounts.type].label) : 'Unknown account';
  const statusCls = s.status==='active' ? 'st-sent' : s.status==='paused' ? 'st-manual' : 'st-draft';
  return '<div class="hist-item" style="cursor:default;">'+
    '<span class="hi-icon">'+icon('wrench')+'</span>'+
    '<span class="hi-main">'+
      '<span class="hi-title">'+escapeHTML(s.plan_name)+' \u2014 '+escapeHTML(acctName)+'</span>'+
      '<span class="hi-sub">'+frequencyLabel(s.frequency)+' \u00B7 next due '+formatDateDisplay(s.next_due_date)+'</span>'+
    '</span>'+'<span class="hi-status '+statusCls+'">'+s.status+'</span>'+
  '</div>';
}

      target.innerHTML = '<div class="empty-state">'+icon('bell')+'<h3>Nothing yet</h3><p>Submitted reports and delivery issues will show up here.</p></div>';
      return;
    }
    target.innerHTML = '<div class="card" style="padding:2px 14px;">' + rows.map(notifRowHTML).join('') + '</div>';
    qsa('.hist-item', target).forEach(function(el){
      el.addEventListener('click', async function(){
        const n = rows.find(function(r){ return r.id === el.dataset.id; });
        if(n && !n.isRead){ await markNotificationRead(n.id, state.profile.id); refreshNotificationBadge(); }
        if(n && n.report_id){ navigate('reportDetail', { viewingReportId: n.report_id }); }
        else { load(); }
      });
    });
  }
  qs('#markAllReadBtn', wrap).addEventListener('click', async function(){
    try{
      const rows = await listNotificationsWithReadState(state.profile.id, state.profile.notification_prefs);
      await Promise.all(rows.filter(function(n){ return !n.isRead; }).map(function(n){ return markNotificationRead(n.id, state.profile.id); }));
      refreshNotificationBadge();
      load();
    } catch(err){
      toast('Could not mark all as read: ' + (err.message||'unknown error'), 'error');
    }
  });
  load();
  return wrap;
}
;
