"use strict";
/* ============================================================
   ANALYTICS (Phase 4)
   Entirely a read layer — no new writes, no new table, computed from
   whatever's already in `reports`, per Section 9 ("mostly an
   aggregation layer"). Bars are plain CSS width percentages, not a
   charting library — the app has none, and adding one for a single
   screen this late felt like more risk than it was worth. Revisit if
   the data volume or chart needs grow past what bars can show.
   ============================================================ */
function bar(label, count, total){
  const pct = total>0 ? Math.round((count/total)*100) : 0;
  return '<div class="bar-row"><div class="bar-row-top"><span>'+escapeHTML(label)+'</span><span>'+count+' ('+pct+'%)</span></div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div></div>';
}
function renderAnalytics(){
  const wrap = document.createElement('div');
  wrap.innerHTML = '<div class="wizard-top"><span class="eyebrow">Analytics</span></div><h2 style="font-size:21px;margin-bottom:16px;">Analytics</h2><p class="small-muted center" style="padding:30px 0;">Loading\u2026</p>';
  loadAnalytics(wrap);
  return wrap;
}
async function loadAnalytics(wrap){
  let reports;
  try{ reports = await getReportsForAnalytics(); }
  catch(err){
    wrap.innerHTML = errorStateHTML(err.message);
    qs('#retryLoadBtn', wrap).addEventListener('click', function(){ loadAnalytics(wrap); });
    return;
  }
  const total = reports.length;

  const byType = {};
  const bySatisfaction = {};
  const byEmailStatus = {};
  const thirtyDaysAgo = new Date(Date.now() - 30*24*60*60*1000);
  let last30 = 0;
  reports.forEach(function(r){
    byType[r.type] = (byType[r.type]||0)+1;
    if(r.satisfaction) bySatisfaction[r.satisfaction] = (bySatisfaction[r.satisfaction]||0)+1;
    byEmailStatus[r.email_status||'draft'] = (byEmailStatus[r.email_status||'draft']||0)+1;
    if(new Date(r.created_at) >= thirtyDaysAgo) last30++;
  });

  let html = '<div class="wizard-top"><span class="eyebrow">Analytics</span></div>';
  html += '<h2 style="font-size:21px;margin-bottom:16px;">Analytics</h2>';

  html += '<div class="stat-grid">';
  html += '<div class="card stat-card"><div class="stat-num">'+total+'</div><div class="stat-label">Total reports</div></div>';
  html += '<div class="card stat-card"><div class="stat-num">'+last30+'</div><div class="stat-label">Last 30 days</div></div>';
  const happyPct = total>0 ? Math.round((((bySatisfaction.very_happy||0)+(bySatisfaction.happy||0))/total)*100) : 0;
  html += '<div class="card stat-card"><div class="stat-num">'+happyPct+'%</div><div class="stat-label">Happy or better</div></div>';
  html += '</div>';

  html += '<div class="card" style="margin-bottom:14px;"><h3 class="section-title" style="font-size:14px;margin-bottom:14px;">By account type</h3>';
  html += Object.keys(TYPE_META).map(function(k){ return bar(TYPE_META[k].label, byType[k]||0, total); }).join('');
  html += '</div>';

  html += '<div class="card" style="margin-bottom:14px;"><h3 class="section-title" style="font-size:14px;margin-bottom:14px;">Client satisfaction</h3>';
  html += ['very_happy','happy','not_happy'].map(function(k){ return bar(satisfactionLabel(k), bySatisfaction[k]||0, total); }).join('');
  if(total===0 || (!bySatisfaction.very_happy && !bySatisfaction.happy && !bySatisfaction.not_happy)){
    html += '<p class="small-muted">No ratings recorded yet.</p>';
  }
  html += '</div>';

  html += '<div class="card"><h3 class="section-title" style="font-size:14px;margin-bottom:14px;">Email delivery</h3>';
  html += bar('Sent automatically', byEmailStatus.sent||0, total);
  html += bar('Sent manually', byEmailStatus.manual||0, total);
  html += bar('Draft (not yet sent)', byEmailStatus.draft||0, total);
  html += '</div>';

  if(total===0){
    wrap.innerHTML = '<div class="wizard-top"><span class="eyebrow">Analytics</span></div><h2 style="font-size:21px;margin-bottom:16px;">Analytics</h2>'+
      '<div class="empty-state">'+icon('barChart')+'<h3>Nothing to analyze yet</h3><p>Numbers show up here once reports start coming in.</p></div>';
    return;
  }
  wrap.innerHTML = html;
}
;

"use strict";
/* ============================================================
   COMING SOON
   Nine of the eleven sidebar items (and two of five tab-bar items)
   point at modules that don't exist yet \u2014 Clients, Accounts,
   Technicians, Schedule, Services, Inventory, Analytics,

   diverge from the reference images' IA) or leave them clicking to
   nothing, each one navigates here: a real screen that says plainly
   what's coming and why it isn't yet, which is what "no dead
   buttons" actually requires \u2014 a click that does something honest,

function renderComingSoon(moduleKey){

    '<div class="coming-soon">'+

      '<h2>'+escapeHTML(meta.label)+' isn\u2019t built yet</h2>'+

}

"use strict";

const state = {
  screen: 'home',
  reportType: null,
  step: 0,
  draft: null,
  settings: { serviceId:'', templateId:'', publicKey:'', fromName:'Gepestcon Co.', configured:false },

/* ============================================================
   THEME (Phase 2)
   Defaults to prefers-color-scheme; a signed-in user's explicit
   choice (Profile \u2192 Appearance) overrides it and persists on
   their profile per Section 7, not just this device. Before sign-in
   there's no profile to read, so the auth screen falls back to
   whatever was last cached locally, then system preference.
   ============================================================ */
const THEME_CACHE_KEY = 'gepestcon_theme_cache';
function getSystemTheme(){
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem(THEME_CACHE_KEY, theme); }catch(e){}
}
function initThemeBeforeAuth(){
  let cached = null;
  try{ cached = localStorage.getItem(THEME_CACHE_KEY); }catch(e){}
  applyTheme(cached || getSystemTheme());
}
function applyThemeFromProfile(){
  applyTheme((state.profile && state.profile.theme_preference) || getSystemTheme());
}

/* ============================================================
   AUTH-GATED SHELL
   Two containers exist in index.html: #authRoot and #appRoot. Only
   one is ever visible \u2014 this is simpler and more robust than tearing
   down and rebuilding the header's event listeners on every sign-in/
   sign-out.
   ============================================================ */
function showAuthScreen(){
  initThemeBeforeAuth();
  removeFooterBar();
  qs('#appRoot').style.display = 'none';
  const authRoot = qs('#authRoot');
  authRoot.innerHTML = '';
  authRoot.appendChild(renderAuthScreen());
  authRoot.style.display = '';
}
function updateHeaderUserChip(){

  el.innerHTML = '<span class="hu-avatar">'+escapeHTML(initials(state.profile.full_name))+'</span>'+
    '<span class="hu-name">'+escapeHTML(state.profile.full_name||'(no name set)')+'<span class="hu-role">'+roleLabel+'</span></span>'+
    '<span class="hu-chevron">'+icon('chevronRight')+'</span>';
}
function renderSidebarStatusCard(){
  const el = qs('#sidebarStatusCard');
  if(!el) return;
  el.innerHTML = '<div class="status-card">'+
    '<span class="sc-icon">'+icon('shield')+'</span>'+
    '<span><span class="sc-eyebrow">System status</span>'+
    '<span class="sc-title">All systems operational</span>'+
    '<span class="sc-dot"><i></i>All good</span></span>'+
  '</div>';
}
async function refreshNotificationBadge(){
  if(!state.profile) return;
  const count = await getUnreadNotificationCount(state.profile.id, state.profile.notification_prefs);
  const bellBtn = qs('#navBellBtn');
  if(bellBtn) bellBtn.classList.toggle('has-badge', count > 0);

function showApp(){

/* ============================================================
   ROUTER
   ============================================================ */
const COMING_SOON_KEYS = [];
function navKeyForScreen(screen){
  if(screen==='home') return 'dashboard';
  if(screen==='clientDetail') return 'clients';
  if(screen==='accountDetail') return 'accounts';
  if(screen==='technicianDetail') return 'technicians';
  return screen;
}
function updateNavActiveStates(){
  const activeKey = navKeyForScreen(state.screen);
  qsa('.sidebar-link').forEach(function(el){ el.classList.toggle('is-active', el.dataset.navKey === activeKey); });
  qsa('.tab-item').forEach(function(el){ el.classList.toggle('is-active', el.dataset.navKey === activeKey); });
  const h = qs('#navHistoryBtn'), s = qs('#navSettingsBtn');
  if(h) h.classList.toggle('is-active', state.screen==='history');
  if(s) s.classList.toggle('is-active', state.screen==='settings');
}
function navigate(screen, params){
  params = params || {};
  state.screen = screen;
  if(params.reportType !== undefined) state.reportType = params.reportType;
  if(params.step !== undefined) state.step = params.step;
  if(params.viewingReportId !== undefined) state.viewingReportId = params.viewingReportId;
  if(params.viewingClientId !== undefined) state.viewingClientId = params.viewingClientId;
  if(params.viewingAccountId !== undefined) state.viewingAccountId = params.viewingAccountId;
  if(params.viewingTechnicianId !== undefined) state.viewingTechnicianId = params.viewingTechnicianId;
  render();
  window.scrollTo(0,0);
}
function render(){
  const app = qs('#app');
  app.innerHTML = '';
  updateNavActiveStates();
  if(state.screen === 'home'){ app.appendChild(renderHome()); removeFooterBar(); }
  else if(state.screen === 'wizard'){ app.appendChild(renderWizard()); }
  else if(state.screen === 'review'){ app.appendChild(renderReview()); }
  else if(state.screen === 'success'){ app.appendChild(renderSuccess()); removeFooterBar(); }
  else if(state.screen === 'history'){ app.appendChild(renderHistory()); removeFooterBar(); }
  else if(state.screen === 'reportDetail'){ app.appendChild(renderReportDetail()); removeFooterBar(); }
  else if(state.screen === 'settings'){ app.appendChild(renderSettings()); removeFooterBar(); }
  else if(state.screen === 'profile'){ app.appendChild(renderProfile()); removeFooterBar(); }
  else if(state.screen === 'clients'){ app.appendChild(renderClientsList()); removeFooterBar(); }
  else if(state.screen === 'clientDetail'){ app.appendChild(renderClientDetail()); removeFooterBar(); }
  else if(state.screen === 'accounts'){ app.appendChild(renderAccountsList()); removeFooterBar(); }
  else if(state.screen === 'accountDetail'){ app.appendChild(renderAccountDetail()); removeFooterBar(); }
  else if(state.screen === 'technicians'){ app.appendChild(renderTechniciansList()); removeFooterBar(); }
  else if(state.screen === 'technicianDetail'){ app.appendChild(renderTechnicianDetail()); removeFooterBar(); }
  else if(state.screen === 'schedule'){ app.appendChild(renderScheduleList()); removeFooterBar(); }
  else if(state.screen === 'services'){ app.appendChild(renderServicesList()); removeFooterBar(); }
  else if(state.screen === 'inventory'){ app.appendChild(renderInventoryList()); removeFooterBar(); }
  else if(state.screen === 'notifications'){ app.appendChild(renderNotificationsList()); removeFooterBar(); refreshNotificationBadge(); }
  else if(state.screen === 'analytics'){ app.appendChild(renderAnalytics()); removeFooterBar(); }
  else if(COMING_SOON_KEYS.indexOf(state.screen) !== -1){ app.appendChild(renderComingSoon(state.screen)); removeFooterBar(); }
  else { app.appendChild(renderHome()); removeFooterBar(); }
}

/* ============================================================
   SETTINGS LOAD (app_settings table, replacing sget('emailjs_settings'))
   ============================================================ */
async function loadSettings(){
  const s = await getAppSettings();
  if(s){
    state.settings.serviceId = s.service_id || '';
    state.settings.templateId = s.template_id || '';
    state.settings.publicKey = s.public_key || '';
    state.settings.fromName = s.from_name || CONFIG.companyName;
    state.settings.configured = !!(s.service_id && s.template_id && s.public_key);
    if(s.company_name) CONFIG.companyName = s.company_name;
    if(s.company_address) CONFIG.companyAddress = s.company_address;
    if(s.company_phone) CONFIG.companyPhone = s.company_phone;
    if(s.company_email) CONFIG.companyEmail = s.company_email;
  }
}

function buildShellNav(){
  qs('#brandMarkSidebar').innerHTML = brandMarkHTML();
  const sidebarNav = qs('#sidebarNav');
  sidebarNav.innerHTML = SIDEBAR_NAV.map(function(item){
    return '<button class="sidebar-link" data-nav-key="'+item.key+'">'+icon(item.icon)+'<span>'+escapeHTML(item.label)+'</span></button>';
  }).join('');
  qsa('.sidebar-link', sidebarNav).forEach(function(btn){
    btn.addEventListener('click', function(){ goToNavKey(btn.dataset.navKey); });
  });

  const tabBar = qs('#bottomTabBar');
  tabBar.innerHTML = TAB_BAR_NAV.map(function(item){
    if(item.isRaised){
      return '<button class="tab-new-report" data-nav-key="'+item.key+'" aria-label="'+escapeHTML(item.label)+'">'+icon(item.icon)+'</button>';
    }
    return '<button class="tab-item" data-nav-key="'+item.key+'">'+icon(item.icon)+'<span>'+escapeHTML(item.label)+'</span></button>';
  }).join('');
  qsa('[data-nav-key]', tabBar).forEach(function(btn){
    btn.addEventListener('click', function(){ goToNavKey(btn.dataset.navKey); });
  });

  renderSidebarStatusCard();
}
function goToNavKey(key){
  if(key==='dashboard' || key==='new-report'){ navigate('home'); return; }
  navigate(key);
}
function wireHeaderChrome(){
  qs('#brandMark').innerHTML = brandMarkHTML();
  qs('#navBellBtn').innerHTML = icon('bell');
  qs('#navHistoryBtn').innerHTML = icon('history');
  qs('#navSettingsBtn').innerHTML = icon('gear');
  qs('#navHomeBtn').addEventListener('click', function(){ navigate('home'); });
  qs('#navHomeBtnDesktop').addEventListener('click', function(){ navigate('home'); });
  qs('#navBellBtn').addEventListener('click', function(){ navigate('notifications'); });
  qs('#navHistoryBtn').addEventListener('click', function(){ navigate('history'); });
  qs('#navSettingsBtn').addEventListener('click', function(){ navigate('settings'); });
  qs('#headerUserBtn').addEventListener('click', function(){ navigate('profile'); });
  buildShellNav();
}

/* ---------------------------------------------------------------
   TEMPORARY (per your request): sign-in gate disabled for review.
   Flip this back to false — or just delete this whole block — to
   restore the normal sign-in screen exactly as it was; nothing
   below it was touched.

   While this is on: the app opens straight to the dashboard with a
   local, made-up "Guest" profile. Nothing is actually signed in to
   Supabase, so anything that writes to the database under a real
   person's name — submitting a report, saving settings, clearing a
   notification — will likely fail quietly or do nothing, since
   there's no real logged-in user for it to attach to. Browsing and
   looking at every screen will work fine.
   --------------------------------------------------------------- */
const DEV_SKIP_AUTH = true;
const DEV_FAKE_PROFILE = {
  id: null,
  full_name: 'Guest (preview)',
  role: 'admin',
  notification_prefs: { report_submitted:true, email_manual_fallback:true, low_stock:true },
  theme_preference: null
};

function init(){
  initThemeBeforeAuth();
  wireHeaderChrome();
  if(DEV_SKIP_AUTH){
    state.profile = DEV_FAKE_PROFILE;
    showApp();
    return;
  }
  sb.auth.onAuthStateChange(async function(event, session){
    state.session = session;
    if(session){
      if(!state.profile || state.profile.id !== session.user.id){
        state.profile = await fetchProfile(session.user.id);
      }
      showApp();
      if(event === 'SIGNED_IN' || event === 'INITIAL_SESSION'){
        await loadSettings();
        checkForSavedDraft();
      }
    } else {
      state.profile = null;
      showAuthScreen();
    }
  });
}
init();
